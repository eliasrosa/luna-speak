# Produção no ZimaOS — imagem local, sem registry (mesmo padrão do wallet-app / roms-manager-server)
# Deploy: via scripts/deploy-manual.sh (do host) OU o workflow deploy-zimaos.yaml (runner).
# O compose é copiado para APP_DIR (/var/lib/casaos/apps/luna-speak) com o .env de prod ao lado.
services:
  lunaspeak:
    build: .
    image: luna-speak:latest
    pull_policy: never
    container_name: lunaspeak
    ports:
      - "8093:8080"
    env_file: .env
    environment:
      STATE_DIR: /data          # estado global de engine (#22): state.json persistente
    volumes:
      - lunaspeak_data:/data    # persiste o estado entre restart/recreate
    restart: unless-stopped

volumes:
  lunaspeak_data:

# x-casaos é chave TOP-LEVEL do compose (o CasaOS lê aqui, não dentro do serviço).
# 'hostname' fica fora do repo público (é o IP do host) — o deploy injeta se necessário.
x-casaos:
  architecture:
    - amd64
  main: lunaspeak
  scheme: http
  port_map: "8093"
  index: /health
  is_uncontrolled: false
  store_app_id: luna-speak
  title:
    custom: LunaSpeak
  tagline:
    custom: Voz do assistente (TTS) no Telegram
  description:
    custom: Microserviço TTS com fallback Edge-TTS (Francisca) -> Piper (offline).
  category: Utilities
