# Produção no ZimaOS — imagem local, sem registry (mesmo padrão do wallet-app / roms-manager-server)
# Deploy: via scripts/deploy-manual.sh (do host) OU o workflow deploy-zimaos.yaml (runner).
# O compose é copiado para APP_DIR (/var/lib/casaos/apps/luna-speak) com o .env de prod ao lado.
services:
  lunaspeak:
    build: .
    image: luna-speak:latest
    pull_policy: never
    container_name: lunaspeak
    ports:
      - "8093:8080"
    env_file: .env
    restart: unless-stopped
    x-casaos:
      title: LunaSpeak
      description: Microserviço TTS (voz do assistente) com fallback Edge-TTS -> Piper
      tagline: Voz do assistente no Telegram
      category: Utilities
      port_map: "8093"
